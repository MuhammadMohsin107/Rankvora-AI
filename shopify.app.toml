# Rankvora AI — Shopify app configuration: a public app, embedded in the Shopify admin.
#
# Read by the Shopify CLI only: `shopify app config link` pulls the live settings into this file and
# `shopify app deploy` pushes what is written here UP to the real app, replacing whatever the dashboard
# held. The running backend never reads it — it takes its credentials and URLs from the Worker's
# variables and secrets (backend/wrangler.jsonc).
#
# ─── The public address ──────────────────────────────────────────────────────
# Every URL below is https://rankvora-ai.cp-chahmad.workers.dev — the "production" Worker in
# backend/wrangler.jsonc, whose BACKEND_URL must stay the same host. To move to a custom domain,
# change it here AND there, deploy the Worker, then run `shopify app deploy`. The host must not
# contain "shopify" or "example": the App Store review rejects it.

client_id = "b2acb4d003ea76bd429b9fa7d77f2761"
name = "Rankvora AI"
application_url = "https://rankvora-ai.cp-chahmad.workers.dev"

# Runs inside the Shopify admin's iframe. The site then proves who is calling with the ID token App
# Bridge adds to every request (backend/src/lib/shopify-id-token.ts) — no cookie, no stored session.
embedded = true

[access_scopes]
# Exactly the SCOPES constant in backend/src/services/shopify-oauth.service.ts, which says why each
# one is needed. Shopify installs the app with these granted (managed installation), so this list is
# what a merchant approves — and what the app is checked against on every open.
#
# read_orders and read_customers are deliberately absent: they are Protected Customer Data, no check
# reads an order or a customer, and asking for them would add a review the app does not need.
#
# `use_legacy_install_flow` is deliberately absent too. The embedded app gets its access token by
# exchanging the ID token (no redirect, no authorization code), which needs managed installation.
scopes = "read_products,read_content,read_themes,read_metaobjects,read_legal_policies,read_online_store_navigation,write_products,write_content"

[auth]
# Used by the redirect flows only — connecting Search Console from the app does not touch this, but the
# fallback "connect a store" path does. Must equal new URL('/api/shopify/callback', BACKEND_URL).
redirect_urls = [ "https://rankvora-ai.cp-chahmad.workers.dev/api/shopify/callback" ]

[webhooks]
# Pinned to SHOPIFY_API_VERSION in backend/src/audit-engine/store-data/shopify-client.ts. Keep in
# step: a skew here silently changes the shape of every payload.
api_version = "2026-07"

  # Both subscriptions are delivered to the Worker, which checks Shopify's signature on each
  # (backend/src/services/shopify-webhook.service.ts). They are declared here and nowhere else — the
  # backend no longer registers any subscription at install, which would deliver each one twice.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/shopify/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/api/shopify/webhooks/app-scopes-update"

  # The three mandatory privacy endpoints every App Store app must provide. Rankvora AI reads no
  # customer or order data, so the first two acknowledge; shop/redact removes the shop's connection.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://rankvora-ai.cp-chahmad.workers.dev/api/shopify/webhooks/customers-data-request"
  customer_deletion_url = "https://rankvora-ai.cp-chahmad.workers.dev/api/shopify/webhooks/customers-redact"
  shop_deletion_url = "https://rankvora-ai.cp-chahmad.workers.dev/api/shopify/webhooks/shop-redact"
