<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
     preserveAspectRatio="xMidYMin slice" fill="none" role="presentation" aria-hidden="true">
  <!--
    ─── Guided setup · decorative backdrop ──────────────────────────────

    PURELY DECORATIVE, and deliberately so. There is no text in this file — no pillar name, no
    sub-pillar name, no label of any kind — and nothing that reads as a measurement: no axis, no
    plotted line, no annotated point. A backdrop resembling a chart would be a picture of data
    nobody produced, sitting behind a form where the merchant has not told us anything yet.

    Three layers, back to front:
      1. MESH — five wide, low-alpha light sources. This is what makes the page feel lit rather
         than tinted, and the reason they overlap at different angles is that a single centred
         glow reads as a vignette.
      2. SWEEP — concentric hairlines opening from off-canvas, which is what Rankvora AI does to a
         store. Abstract enough to carry no claim, specific enough not to look like stock.
      3. GRAIN — a few percent of monochrome noise over everything. Large flat gradients band on
         8-bit displays, and grain is what breaks the bands up; it is also most of the difference
         between a gradient that looks designed and one that looks like a default.

    ONE FILE FOR BOTH THEMES. An SVG used as a CSS background renders in secure static mode, so a
    prefers-color-scheme query inside it is not reliably honoured and it cannot read the host
    page's custom properties. Every ink here is therefore literal: the mid-tone brand indigo
    (#6366f1 / #818cf8) and the logo's emerald (#22c55e), all at low alpha, so the theme's own
    background shows through and tints the result on the near-white wash and the near-black one
    alike. The dot texture lives in CSS beside this file, where it stays crisp at any viewport.

    `slice` + xMidYMin: the art fills whatever box it is given, anchored to the top and cropped at
    the sides rather than letterboxed, so it is full-bleed on an ultrawide and on a laptop.
  -->
  <defs>
    <!-- Positioned off the corners and edges: the busiest part of the canvas is never behind the
         step card, which sits centre-right and is opaque. -->
    <radialGradient id="meshA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(230 -30) rotate(46) scale(900 720)">
      <stop stop-color="#6366f1" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(1490 -90) rotate(132) scale(840 680)">
      <stop stop-color="#818cf8" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- The off-centre one. Without it the two corner glows read as a symmetrical arch. -->
    <radialGradient id="meshC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(940 250) rotate(18) scale(700 520)">
      <stop stop-color="#a5b4fc" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>

    <!-- The logo's green, once and quietly. It stops the palette reading as a generic indigo SaaS
         wash without ever becoming a second brand colour. -->
    <radialGradient id="meshAccent" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(120 1010) rotate(-46) scale(700 520)">
      <stop stop-color="#22c55e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshDepth" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(1560 980) rotate(-140) scale(680 520)">
      <stop stop-color="#6366f1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!--
      The lower-middle light. Added after seeing the backdrop rendered: with light only at the four
      corners, the whole centre-bottom of the canvas fell to flat wash, and because the artwork is
      fixed to the viewport that flat band is what a merchant looks at for the entire scroll of a
      long step. Violet rather than indigo so the mesh shifts hue as it descends instead of being
      one colour at five opacities.
    -->
    <radialGradient id="meshLower" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(700 860) rotate(-24) scale(760 500)">
      <stop stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Arcs fade along the sweep's own direction, so the set has travel and does not ring the
         canvas like a target. -->
    <!-- Raised after seeing it rendered: at 0.30/0.20 the sweep was below the threshold where a
         hairline reads at all on a light wash, so the artwork was five invisible lines and a
         gradient. It has to be present enough to be a shape and quiet enough never to compete
         with the step card's own border. -->
    <linearGradient id="arcFade" x1="180" y1="1000" x2="1520" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5" stop-opacity="0.50"/>
      <stop offset="0.5" stop-color="#4f46e5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="arcFadeSoft" x1="140" y1="1000" x2="1420" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- fractalNoise, desaturated. Darkens a light page and lifts a dark one by the same few
         percent, which is exactly what a film grain should do in either theme. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <g>
    <rect width="1600" height="1000" fill="url(#meshA)"/>
    <rect width="1600" height="1000" fill="url(#meshB)"/>
    <rect width="1600" height="1000" fill="url(#meshC)"/>
    <rect width="1600" height="1000" fill="url(#meshAccent)"/>
    <rect width="1600" height="1000" fill="url(#meshDepth)"/>
    <rect width="1600" height="1000" fill="url(#meshLower)"/>
  </g>

  <!--
    The sweep: five hairlines on one origin below the lower-left corner, drawn as full CIRCLES
    rather than arc paths. Circles are what makes the set exactly concentric — an arc path takes a
    start point, an end point and a radius, so nesting five of them evenly means solving for each
    endpoint by hand, which is how a "sweep" ends up as five lines that quietly cross each other.
    The centre sits off-canvas, so only the arc inside the viewBox is ever drawn.

    cx/cy on each circle rather than a transform on the group: these strokes are painted with
    userSpaceOnUse gradients, and a group transform moves the gradient's own coordinate system
    along with the shapes, sliding the fade off the canvas.

    They thin as they widen, so the set has depth instead of reading as five identical rings.
  -->
  <g fill="none" stroke-linecap="round">
    <circle cx="-120" cy="1120" r="620"  stroke="url(#arcFade)"     stroke-width="1.4"/>
    <circle cx="-120" cy="1120" r="860"  stroke="url(#arcFadeSoft)" stroke-width="1.2"/>
    <circle cx="-120" cy="1120" r="1100" stroke="url(#arcFade)"     stroke-width="1.05"/>
    <circle cx="-120" cy="1120" r="1340" stroke="url(#arcFadeSoft)" stroke-width="0.95"/>
    <circle cx="-120" cy="1120" r="1580" stroke="url(#arcFade)"     stroke-width="0.85"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.045"/>
</svg>
